contract:
  name: topic5_stable_interaction_graph_rnn_v2
  source_spec: docs/superpowers/specs/2026-07-31-topic5-stable-interaction-graph-rnn-v2.md

data:
  dataset_dir: results/topic5_interictal_rank_distribution/dataset_v0_4
  validation_fraction: 0.15
  test_fraction: 0.15
  old_outer_heldout20_forbidden: true
  max_train_events: 9600
  max_validation_events: 2048
  max_test_events: 2048

model:
  phase_rank: 3
  max_weight: 3.0
  initial_leak: 0.25
  graph_l1_weight: 0.0005
  event_drive: false
  process_noise: false
  multiple_fields: false

training:
  epochs: 300
  patience: 35
  learning_rate: 0.03
  batch_events: 256
  gradient_clip: 1.0
  convergence_tolerance: 0.002
  minimum_relative_improvement: 0.001
  minimum_training_epochs: 20
  minimum_best_epoch: 3
  maximum_recovery_depth: 2
  static_scaffold_steps: 300
  static_scaffold_learning_rate: 0.05
  static_scaffold_seed: 20260731
  fit_seeds: [20260731, 20260732, 20260733]

evaluation:
  rollout_repeats: 4
  graph_increment_models: [sig0_nograph, sig1_feedback_graph]
  continue_to_full_baseline_ladder_requires:
    n_patients_nll_better: 4
    n_patients_precedence_mae_better: 4
    n_patients_both_better: 4

pilot:
  subjects:
    - epilepsiae_922
    - epilepsiae_620
    - epilepsiae_1096
    - yuquan_zhangkexuan
    - yuquan_chenziyang
    - yuquan_zhangjiaqi

forbidden_inputs:
  ab_or_axis: true
  soz: true
  ictal: true
  geometry: true
  iei: true
  snn: true
