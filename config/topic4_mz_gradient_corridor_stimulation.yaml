# MZ gradient-corridor stimulation — frozen parameter contract (2026-07-22)
# Scientific question: in a Z+M spiking network whose pathology axis + electrode montage
# come from a subject's frozen interictal template-gradient field, does virtual inhibition
# of the mid-corridor bipolar pair beat inhibition of either axis endpoint at
#   (1) delaying operational runaway, (2) reducing cross-corridor global spread,
#   (3) keeping local events, WITHOUT (4) globally silencing everything.
# Upper bound of any claim: "in this patient-layout-mapped Z+M SNN, mid-corridor virtual
# inhibition changes operational runaway and model propagation extent." NOT clinical.

contract: topic4_mz_gradient_corridor_stimulation_v1

# ---- frozen interictal gradient input (MAIN checkout, read-only) ----
input_root: /home/honglab/leijiaxin/HFOsp/results/interictal_propagation_masked/template_gradient_fields
gradient_contract: topic5_interictal_template_fields_v1
axis_definition: template_propagation_axis_v2
axis_direction_convention: positive_early_to_late
fingerprint_algorithm: sha256_v1p1_nonfinite_canonical

# ---- cohort (frozen) ----
primary_cohort:
  - epilepsiae_1084
  - epilepsiae_1146
  - epilepsiae_583        # entered as candidate; geometry_audit decides final admission
  - epilepsiae_590
  - epilepsiae_958
  - yuquan_zhaochenxi
sensitivity_cohort:
  - epilepsiae_384        # non_strict_2d; reported separately, never pooled
# entry gates (ALL required for primary): axis_pair_estimable, geometry_2d_supported,
# strict_stability_pass, relation==reversed, shared_axis.status==ok,
# interictal_field.status==ok, fingerprint valid, >=3 distinct non-overlapping adjacent bipolar sites.

# ---- frozen Z+M candidate: zA_q75_tz5000__mA0p001_tau500 ----
mz_candidate:
  label: zA_q75_tz5000__mA0p001_tau500
  use_z: true
  use_m: true
  I_th_EI: 95.19851312666987
  tau_z: 5000.0
  tau_adp: 500.0
  eta_m: 0.007451594355587098

# ---- frozen SNN organization (identical across patients; NEVER per-patient tuned) ----
snn:
  L: 20.0
  density: 100.0
  g: 3.6
  drive: 0.6            # nu_ext_ratio
  dt: 0.1
  theta_EE_deg: 0.0     # corridor aligned to sheet-x; anisotropy along corridor for all patients
  AR: 2.0
  core_mean: 17.5
  core_std: 1.0
  core_r: 1.5
  base_mean: 18.0
  sheet_margin_mm: 2.0  # isotropic fit target box = [margin, L-margin]^2
  core_quantiles: [0.10, 0.90]   # Q10/Q90 of along-distribution -> the two cores

# ---- stimulation (virtual inhibition = threshold raising) ----
stim:
  delta_mv: 50.0        # V_th raise on target E cells during pulse (identical across arms); strong virtual inhibition
  radius_mm: 1.5        # fixed physical radius for candidate E cells around a bipolar-pair midpoint
  # N_target = min candidate count across a subject's stim sites; each site takes its nearest N_target E cells.

# ---- simulation time / windows ----
sim:
  t_max_ms: 20000.0
  stim_on_frac: 0.45    # of baseline runaway time
  stim_off_frac: 0.75
  min_pre_stim_events: 3
  runaway_hz: 120.0
  runaway_dur_ms: 100.0
  seeds: [1, 3, 4]
  # event detection (reuse cmrun): BIN_MS=1.0, BASELINE_MS=(5,50), CAL_FRAC=0.5 (imported, not duplicated).
  # spatial observer bins:
  axial_bins: 20
  transverse_bins: 12
  spatial_bin_ms: 5.0

# ---- resource guard ----
resource:
  max_workers_cap: 12
  reserve_gib: 64
  rss_multiplier: 1.5
  swap_growth_stop_gib: 1.0
  memavail_floor_gib: 64.0
