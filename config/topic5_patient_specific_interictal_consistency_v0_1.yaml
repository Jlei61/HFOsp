contract: topic5_patient_specific_interictal_consistency_v0_1
artifact_root: /home/honglab/leijiaxin/HFOsp
dataset_root: results/topic5_interictal_rank_distribution/dataset_v0_4
target_cache_root: results/topic5_history_conditioned_field_refinement_v0_4/cache
output_root: results/topic5_patient_specific_interictal_consistency_v0_1

split:
  fit_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20

models:
  primary: full_history_gru
  sensitivity: linear_state
  hidden_size: 32
  contact_embedding_dim: 32
  contact_encoder_hidden: 32
  local_offset_dim: 8

training:
  seeds: [11, 29, 47]
  coverage_cycles: 7
  updates_per_cycle: 32
  batch_events: 256
  learning_rate: 0.0003
  local_learning_rate: 0.0003
  weight_decay: 0.0
  gradient_clip: 1.0
  rank_shuffle_control: true

readout:
  free_rollouts: 5000
  rank_bins: 10
  candidate_fields:
    - participation
    - early_joint_mass
    - late_joint_mass
    - endpoint_joint_mass
    - weighted_earliness

ictal_transfer:
  alignment: clinical_onset
  window_seconds: [0.0, 10.0]
  primary_band_hz: [1.0, 150.0]
  primary_target_key: target_1_150
  sensitivity_band_hz: [1.0, 45.0]
  sensitivity_target_key: target_1_45
  all_contact_permutations: 5000
  within_shaft_permutations: 5000
  development_subject: epilepsiae_1146

resources:
  python: /home/honglab/leijiaxin/anaconda3/envs/cuda_env/bin/python
  device: cuda
  torch_num_threads: 2
  gpu_memory_fraction_per_process: 0.06
  default_workers: 14

forbidden_inputs:
  empirical_ab_fields: true
  ab_labels: true
  ictal_target_during_training: true
  other_patient_events: true
  soz_or_clinical_labels: true
