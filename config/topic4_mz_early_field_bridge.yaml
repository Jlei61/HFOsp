# MZ early-field bridge — frozen configuration
# Design: docs/superpowers/specs/2026-07-19-topic4-mz-early-field-bridge-design.md
# Candidate cfg values copied verbatim from results/topic4_sef_hfo/mz_slowvars/p3_candidates.json.
schema_version: mz_early_field_bridge_v1

subject: epilepsiae_1146
montage: narrow

# ---- frozen candidates (design §5) ----
candidate:                       # PRIMARY: longest robust pre-transition epoch
  label: zA_q75_tz5000
  cfg: {use_z: true, use_m: false, I_th_EI: 95.19851312666987, tau_z: 5000.0}
sensitivity_candidate:           # only after ALL primary deliverables + >90 min left (design §5, prompt P2.7)
  label: zA_q50_tz10000
  cfg: {use_z: true, use_m: false, I_th_EI: 1.6652801609959704, tau_z: 10000.0}

seeds: [1, 3, 4]
T_ms: 15000.0
dt: 0.1

# ---- fixed-bar event detector (design §6): freeze once from slow-off, reuse for native ----
event_detector:
  bin_ms: 1.0                    # C.BIN_MS
  baseline_ms: [5.0, 50.0]       # C.BASELINE_MS (quiet window for floor + envelope baseline)
  cal_frac: 0.5                  # C.CAL_FRAC ; bar = floor + cal_frac*(max(af_slowoff)-floor)

# ---- interictal timing templates (design §7.2/§7.3) ----
timing:
  band_hz: [30.0, 80.0]
  filter_order: 4
  event_offset_ms: 40.0          # window = event onset .. (event offset + 40), capped before next event/record end
  readable_mad_k: 5.0            # readable: event peak > quiet_median + k*MAD(quiet)
  readable_rel_peak: 0.10        # AND excess peak >= 10% of the largest contact excess peak in that event
  min_readable_contacts: 6
  direction_abs_spearman: 0.30   # A_to_B: axis-latency rho >= +0.30 ; B_to_A: <= -0.30 ; else unresolved
split:
  min_train_events: 3
  min_heldout_events: 2
  min_shared_contacts: 6

# ---- onset markers (design §8.1) ----
onset:
  runaway_hz: 120.0              # t120: first 100ms with >=80% of 20ms-smoothed E-rate >= 120 Hz
  runaway_dur_ms: 100.0
  smooth_win_ms: 20.0
  theta_recruit_pct: 99.9        # theta_recruit_seed = P99.9(r20_slowoff)
  recruit_gap_ms: 5.0            # allow <=5ms subthreshold gaps in the t_recruit component

# ---- fixed windows relative to t_recruit (design §8.2) ----
windows:
  primary_ms: [0.0, 50.0]
  sensitivity_ms: [[0.0, 100.0], [0.0, 25.0], [25.0, 50.0], [50.0, 100.0]]
  optional_ms: [100.0, 300.0]    # emitted only when naturally complete

# ---- source-grid fields (design §7.3/§8.4) ----
source_grid:
  n: 24                          # _spatial_movie MOVIE_GRID: ix=clip(floor(posE[:,0]/L*24),0,23)
  min_active_e_per_bin: 5

# ---- direct-core-excluded support (design §9) ----
core_excluded:
  contact_kernel_width_mm: 1.5   # Gaussian kernel projecting core membership onto contacts
  contact_core_loading_threshold: 0.5   # contact kept (non-core) iff loading < threshold
  min_support: 6                 # else insufficient_core_excluded_support (NO fallback to all-support)

# ---- local tissue participation audit (design §9) ----
participation_audit:
  radius_mm: 1.5                 # fraction of E within 1.5mm of a contact that fire in event + early window

# ---- association nulls (design §9) ----
nulls:
  n_permutations: 10000
  max_exact_permutations: 50000
  seed: 0

# ---- optional §10 z-snapshot global/local decomposition (off by default) ----
snapshots:
  enabled: false
