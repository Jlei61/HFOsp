# Topic 4 MZ early-onset dynamics — phase portrait / nonlinear ignition / causal bridge.
# Design contract (BINDING): docs/superpowers/specs/2026-07-19-topic4-mz-onset-dynamics-phase-portrait-design.md
# Autonomous prompt: docs/superpowers/plans/2026-07-19-topic4-mz-onset-dynamics-autonomous-agent-prompt.md
#
# Tier = model-side mechanism analysis. NOT seizure validation. Every phenotype is a detection label.
# All parameters are LOCKED before the target runs; nothing here is tuned on a bridge/threshold result.

schema_version: mz-onset-dynamics-1.0
subject: epilepsiae_1146
montage: narrow
dt_ms: 0.1

# --- candidates (cfg fields verbatim from mz_slowvars multiseed; onset anchors are READ, never re-estimated) ---
candidates:
  primary:
    label: zA_q75_tz5000
    cfg: {use_z: true, use_m: false, I_th_EI: 95.19851312666987, tau_z: 5000.0}
    onset_ms: {1: 9293.6, 3: 9499.3, 4: 9757.9}   # locked operational-runaway onset per seed (mz_slowvars multiseed)
    reason: robust 3/3 delayed runaway, longest pre-transition interval
  sensitivity:
    label: zA_q50_tz10000
    cfg: {use_z: true, use_m: false, I_th_EI: 1.6652801609959704, tau_z: 10000.0}
    onset_ms: {1: 4937.0, 3: 4706.8, 4: 4861.5}
    reason: independent faster robust-runaway family

seeds: [1, 3, 4]

# --- registered slow-state anchors (spec §4). mid_fraction = 0.50 * onset; times resolve per seed. ---
registered_states: [baseline_1000ms, mid_fraction, pre_onset_500ms, pre_onset_100ms, onset]
baseline_ms: 1000.0
mid_fraction: 0.50
pre_onset_500_ms: 500.0
pre_onset_100_ms: 100.0
event_pre_offset_ms: 20.0     # event_pre  = event_onset - 20 ms
event_post_offset_ms: 100.0   # event_post = event_offset + 100 ms

# --- current-aware inhibition observer (spec §5.2). accumulate ONLY over these windows; never N x T. ---
q_eff_window_ms: 20.0         # fixed pre-state window W_t
q_eff_eps: 1.0e-9

# --- regions for slow-state coordinates (spec §5.1) ---
regions: [all_E, source_core, sink_core, axis_corridor, off_axis, core_excluded]
axis_corridor_halfwidth_norm: 0.5   # perpendicular half-width (normalized M3B units) of the scaffold corridor

# --- frozen fast-system operator: REUSE upstream state_conditioned_susceptibility config verbatim ---
operator:
  grid_n: 12
  grid_n_audit: 8
  L_norm: 5.0
  L_phys: 20.0
  center_phys: [10.0, 10.0]
  ell_perp: 0.6
  ar: 2.0
  mu_core: 0.6
  w_ee_mult: 1.05      # free-normalized proxy anchor (upstream re-anchored 1.3->1.05); ABSOLUTE op is proxy-normalized
  ratio: 1.0
  core_radius_norm: 0.375
  q_floor: 0.05
  p_max: 4
  gabor_sigma: 1.0
  gabor: true
  probe_center: source
  T_windows: [10.0, 30.0, 50.0, 75.0]
  T_primary: 30.0
  shuffle_seed: 20260719
  op_dt: 0.5
  op_t_max: 2500.0
  op_tol: 1.0e-9

# --- controlled realized (D,A) grid (spec §6.1). A-axis = uniform coarse mu-decrement (proxy units). ---
DA_grid:
  n_D: 9                                   # equally spaced baseline D_axis .. 1.10*max onset D_axis, clip [0,0.95]
  D_clip: [0.0, 0.95]
  D_overshoot: 1.10
  A_fracs: [0.00, 0.025, 0.05, 0.075, 0.10, 0.15, 0.20]   # fraction of coarse |muE| reference scale
  controls: [uniform, rotated_90, spatial_shuffle, z_blocked]

# --- full-SNN nonlinear ignition (spec §7). deterministic 10-ms threshold-lowering probe via MZ threshold hook. ---
ignition:
  probe_ms: 10.0
  horizon_ms: 500.0
  amplitude_ladder: [0.0, 0.025, 0.05, 0.10, 0.20]   # threshold-gap units a = dVth / median(Vth - Vreset)
  bisection_refinements: 2
  probe_locations: [source_core, sink_core, off_axis]
  probe_radius_norm_mm: 0.3        # focal probe disk radius (mm) = PP.R_KICK
  runaway_hz: 120.0
  runaway_dur_ms: 100.0

# --- z counterfactuals (spec §8). branch at pre_onset_500 / pre_onset_100. ---
z_counterfactuals:
  states: [pre_onset_500ms, pre_onset_100ms]
  branches: [native_dynamic, native_frozen, uniform_mean_matched, spatial_shuffle, reset_one, rotated_90]
  shuffle_seed: 20260719

# --- interictal event suppression (spec §9). calibrate pulse on slow-off ONLY, lock before target runs. ---
event_suppression:
  pulse_ms: 20.0
  pulse_lead_ms: 5.0
  amplitude_candidates: [0.025, 0.05, 0.10, 0.20]    # threshold-gap units; smallest that cuts peak active frac >=50%
  max_silence_ms: 200.0
  n_target_events: 3          # last 3 eligible returning events ending >= 200 ms before onset
  event_end_guard_ms: 200.0

# --- focused m push-pull (spec §10). explicitly post-discovery; NOT the invalid Arm-C grid. ---
focused_m:
  z_regimes:
    - {label: zA_q75_tz10000, cfg: {use_z: true, I_th_EI: 95.19851312666987, tau_z: 10000.0}}
    - {label: zA_q75_tz5000,  cfg: {use_z: true, I_th_EI: 95.19851312666987, tau_z: 5000.0}}
  tau_adp_ms: 2000.0
  A_fracs: [0.00, 0.025, 0.05, 0.10, 0.20]   # target adaptation-current fraction of I_EE_scale
  I_EE_scale: 272.75518960107513             # from mz_slowvars calibration.json
  peak_m_tau2000: 36.6036014019694           # from calibration.json (eta_m = frac*I_EE_scale/peak_m)
  seeds: [1, 3, 4]

# --- upstream artifacts consumed (verified paths; hashes recorded at run time into provenance) ---
upstream:
  susceptibility_root: results/topic4_sef_hfo/state_conditioned_susceptibility
  snapshots_primary: results/topic4_sef_hfo/state_conditioned_susceptibility/snapshots/zA_q75_tz5000
  snapshots_sensitivity: results/topic4_sef_hfo/state_conditioned_susceptibility/snapshots/zA_q50_tz10000
  susceptibility_atlas: results/topic4_sef_hfo/state_conditioned_susceptibility/susceptibility_atlas.json
  second_candidate_sensitivity: results/topic4_sef_hfo/state_conditioned_susceptibility/second_candidate_sensitivity.json
  bridge_root: results/topic4_sef_hfo/mz_early_field_bridge
  bridge_cohort_summary: results/topic4_sef_hfo/mz_early_field_bridge/cohort_summary.json
  calibration: results/topic4_sef_hfo/mz_slowvars/calibration.json
