# MZ early-field bridge V2 (z+m, tau_adp=500) — FROZEN configuration
# Design: docs/superpowers/specs/2026-07-19-topic4-mz-early-field-bridge-design.md (bridge readout contract)
# V2 extends V1 (config/topic4_mz_early_field_bridge.yaml): the ONLY change vs V1 is the native candidate
#   slow-vars config (z-only -> z+m). Every readout / null / window / detector setting is byte-identical to
#   V1 so the V1<->V2 comparison isolates the effect of adding the fast adaptation variable m.
#
# NOTHING here is tuned on a bridge/maxAB result (design §5, §15). The candidate is the committed
# MZ onset-dynamics tau500 operational-runaway candidate (onset 12956.2/11008.6/12676.6 ms for seeds 1/3/4).
schema_version: mz_early_field_bridge_v2_zm

subject: epilepsiae_1146
montage: narrow

# ---- FROZEN V2 candidate (z+m). cfg = engine fields only (splatted into MZSlowVarsConfig). ----
candidate:
  label: zA_q75_tz5000__mA0p001_tau500
  # cfg keys MUST all be MZSlowVarsConfig fields (use_z/use_m/tau_z/I_th_EI/tau_adp/eta_m). A_target is NOT
  # an engine field (it only DERIVES eta_m) and is kept OUTSIDE cfg to avoid a TypeError on the **cfg splat.
  cfg: {use_z: true, use_m: true, I_th_EI: 95.19851312666987, tau_z: 5000.0, tau_adp: 500.0,
        eta_m: 0.007451594355587098}
  # eta_m provenance (verified in preflight against the committed calibration, never hand-copied):
  #   eta_m = A_target * I_EE_scale / peak_m_tau2000
  #         = 0.001 * 272.75518960107513 / 36.6036014019694 = 0.007451594355587098
  #   I_EE_scale, peak_m_tau2000 from results/topic4_sef_hfo/mz_slowvars/calibration.json.
  #   The committed tau500 runs used the tau2000-normalized peak (NOT peak_m.tau500=13.1957); the tau
  #   sensitivity held eta_m FIXED and varied only tau_adp. Using peak_m.tau500 would change eta_m to
  #   0.02067 and BREAK onset reproduction = retuning the frozen candidate (forbidden).
  A_target: 0.001              # metadata only (derivation basis for eta_m); NOT passed to the engine
  eta_m_calibration:
    formula: A_target * I_EE_scale / peak_m_tau2000
    I_EE_scale: 272.75518960107513
    peak_m_tau2000: 36.6036014019694
    source: results/topic4_sef_hfo/mz_slowvars/calibration.json

seeds: [1, 3, 4]
T_ms: 20000.0                  # native z+m trajectory length (task-specified; committed candidate used --t-ms 20000)
slowoff_T_ms: 15000.0          # slow-off template length; MATCHES V1 so the interictal templates are identical
dt: 0.1

# ---- preflight gate (design §16, task §6): native t120 must reproduce the committed onset within tol ----
preflight:
  reference_onset_ms: {1: 12956.2, 3: 11008.6, 4: 12676.6}   # committed focused_m_tau500_seed{S}_g0.001.json runaway_ms
  t120_tol_ms: 1.0

# ==== everything below is byte-identical to config/topic4_mz_early_field_bridge.yaml (V1) ====

# ---- fixed-bar event detector (design §6): freeze once from slow-off, reuse for native ----
event_detector:
  bin_ms: 1.0
  baseline_ms: [5.0, 50.0]
  cal_frac: 0.5

# ---- interictal timing templates (design §7.2/§7.3) ----
timing:
  band_hz: [30.0, 80.0]
  filter_order: 4
  event_offset_ms: 40.0
  readable_mad_k: 5.0
  readable_rel_peak: 0.10
  min_readable_contacts: 6
  direction_abs_spearman: 0.30
split:
  min_train_events: 3
  min_heldout_events: 2
  min_shared_contacts: 6

# ---- onset markers (design §8.1) ----
onset:
  runaway_hz: 120.0
  runaway_dur_ms: 100.0
  smooth_win_ms: 20.0
  theta_recruit_pct: 99.9
  recruit_gap_ms: 5.0

# ---- fixed windows relative to t_recruit (design §8.2) ----
windows:
  primary_ms: [0.0, 50.0]
  sensitivity_ms: [[0.0, 100.0], [0.0, 25.0], [25.0, 50.0], [50.0, 100.0]]
  optional_ms: [100.0, 300.0]

# ---- source-grid fields (design §7.3/§8.4) ----
source_grid:
  n: 24
  min_active_e_per_bin: 5

# ---- direct-core-excluded support (design §9) ----
core_excluded:
  contact_kernel_width_mm: 1.5
  contact_core_loading_threshold: 0.5
  min_support: 6

# ---- local tissue participation audit (design §9) ----
participation_audit:
  radius_mm: 1.5

# ---- association nulls (design §9) ----
nulls:
  n_permutations: 10000
  max_exact_permutations: 50000
  seed: 0

# ---- optional §10 z-snapshot global/local decomposition (off by default) ----
snapshots:
  enabled: false
