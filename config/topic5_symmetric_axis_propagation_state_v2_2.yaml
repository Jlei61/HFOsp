contract:
  name: topic5_symmetric_axis_propagation_state_rnn
  version: "2.2"
  spec: docs/superpowers/specs/2026-07-26-topic5-symmetric-axis-propagation-state-rnn-v2_2.md
  plan: docs/superpowers/plans/2026-07-26-topic5-symmetric-axis-propagation-state-rnn-v2_2.md
  ictal_target_values_sealed: true
  snn_benchmark_forbidden: true
  topology_axis_fallback_forbidden: true

inputs:
  rank_dataset: results/topic5_interictal_rank_distribution/dataset_v0_4
  old_closeout: results/topic5_structured_axis_graph/persistent_path_mode_closeout_v1_0/closeout_manifest.json
  old_report: docs/archive/topic5/persistent_path_mode_rnn_formal_result_2026-07-26.md
  ab_axis_root: results/interictal_propagation_masked/template_gradient_fields/per_subject
  target_routing_table: results/topic5_state_conditioned_predictor/fit12_clinical_bb150/fit2/fig6_fit2_clinical_onset_scaffold_event.csv
  target_metadata_root: results/topic5_state_conditioned_predictor/fit2_prefix_scaffold/bb150_cache_view
  epilepsiae_seizure_inventory: results/epilepsiae_seizure_inventory.csv

cohort:
  expected_all: 34
  expected_geometry_complete: 25
  expected_sequence_formal: 31
  expected_physical_axis_formal: 22
  expected_geometry_incomplete_sequence: 9
  development:
    - epilepsiae_1077
    - epilepsiae_1146
    - yuquan_chengshuai
  development_split: [0.60, 0.20, 0.20]
  formal_train_fraction: 0.80

model:
  anisotropy_ratio_bounds: [1.0, 4.0]
  rho_p_bounds: [0.0, 0.999]
  gamma_bounds: [0.0, 1.0]
  eps: 1.0e-8
  stop:
    c_p_nonpositive: true
    c_n_nonnegative: true
  objectives:
    - next_only
    - next_plus_rollout_h3
    - next_plus_rollout_h5
  rollout_train_horizons:
    next_only: 0
    next_plus_rollout_h3: 3
    next_plus_rollout_h5: 5

optimizer:
  name: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  max_epochs: 200
  patience: 15
  seeds: [17, 29, 43]

statistics:
  null_seed: 20260726
  random_directions: 256
  shaft_preserving_permutations: 256
  source_quantiles: [0.25, 0.75]
  min_train_events_per_side: 100
  min_heldout_events_per_side: 25
  two_w_margin_fraction: 0.10
  alpha: 0.05

target_metadata:
  group_id: strict_broadband
  time_reference: clinical_onset
  band: broadband_1_150
  window_seconds: [0.0, 10.0]
  min_source_contacts: 1
  min_non_source_contacts: 4
  min_seizures_primary: 1
  min_seizures_sensitivity: 2
  source_policy: exact_per_seizure_clinical_onset_contacts_only
  source_substitutions_forbidden:
    - energy_top_contacts
    - soz
    - interictal_template_source
    - patient_level_focus_region

resources:
  conda_env: cuda_env
  device: cuda
  min_system_memory_available_gb: 32
  min_gpu_free_fraction: 0.20
  cpu_threads_per_process: 8

outputs:
  root: results/topic5_symmetric_axis_propagation_state_v2_2
  paper_figure: results/paper-ready-figure/fig6_symmetric_axis_propagation_state_v2_2

